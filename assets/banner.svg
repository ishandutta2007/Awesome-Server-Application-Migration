<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- Filter for Neon Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 42px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 19px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .pulse-line {
      stroke-dasharray: 12, 12;
      animation: dash 20s linear infinite;
    }
    .pulse-dot {
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -240;
      }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.9; transform: scale(1.02); }
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/>

  <!-- Background Dynamic Network Flow & Node Graphics (Behind Text) -->
  <g opacity="0.4">
    <!-- Animated Migration Flow Lines -->
    <path d="M 100 280 C 300 220, 450 320, 650 250 C 850 180, 1000 290, 1120 220" 
          fill="none" stroke="url(#primaryGlow)" stroke-width="2" class="pulse-line"/>
    <path d="M 80 120 C 280 60, 500 180, 720 90 C 880 30, 1020 120, 1140 70" 
          fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="8,8"/>

    <!-- Server & Cloud Nodes -->
    <circle cx="150" cy="270" r="6" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="650" cy="250" r="8" fill="#818cf8" filter="url(#glow)"/>
    <circle cx="1120" cy="220" r="7" fill="#c084fc" filter="url(#glow)"/>

    <!-- Migration Data Signal Particles -->
    <circle cx="400" cy="255" r="4" fill="#38bdf8">
      <animate attributeName="cx" values="150;650;1120" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="270;250;220" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="210" r="3" fill="#c084fc">
      <animate attributeName="cx" values="650;1120;150" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="250;220;270" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Hero Content Glassmorphism Container (Ensures 100% Text Foreground Readability) -->
  <rect x="50" y="45" width="1100" height="270" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Category Pill Badge -->
  <rect x="90" y="80" width="340" height="32" rx="16" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
  <circle cx="110" cy="96" r="4" fill="#38bdf8"/>
  <text x="126" y="101" class="badge-text">Workload &amp; Cloud Mobility Ecosystem</text>

  <!-- Title -->
  <text x="90" y="165" class="title">Awesome Server &amp; Application Migration</text>

  <!-- Subtitle Line 1 & Line 2 -->
  <text x="90" y="210" class="subtitle">Curated List of Commercial Migration Platforms &amp; Open-Source Conversion Engines</text>
  <text x="90" y="238" class="subtitle" fill="#64748b" font-size="16px">Workload Replication • P2V &amp; V2V Mobility • Disaster Recovery • Multi-Cloud Cutover</text>

  <!-- Visual Feature Icons / Tags -->
  <g transform="translate(90, 265)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="120" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="60" y="17" fill="#cbd5e1" font-size="12" font-family="system-ui" text-anchor="middle">⚡ Live Cutover</text>

    <!-- Tag 2 -->
    <rect x="132" y="0" width="130" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="197" y="17" fill="#cbd5e1" font-size="12" font-family="system-ui" text-anchor="middle">🔄 V2V &amp; P2V Engine</text>

    <!-- Tag 3 -->
    <rect x="274" y="0" width="130" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="339" y="17" fill="#cbd5e1" font-size="12" font-family="system-ui" text-anchor="middle">☁️ Multi-Cloud</text>

    <!-- Tag 4 -->
    <rect x="416" y="0" width="140" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="486" y="17" fill="#cbd5e1" font-size="12" font-family="system-ui" text-anchor="middle">🛡️ Disaster Recovery</text>
  </g>

</svg>
